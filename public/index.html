<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Fleet Manager — Business Central</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f0f4f8; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    header { margin-bottom: 30px; }
    h1 { color: #0f172a; font-size: 28px; }
    header p { color: #64748b; margin-top: 6px; }
    table { width: 100%; background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,.08); border-collapse: collapse; }
    th { background: #0f766e; color: white; text-align: left; padding: 14px 18px; font-size: 14px; }
    td { padding: 14px 18px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    tr:hover { background: #f8fafc; }
    .badge { padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
             background: #d1fae5; color: #065f46; }
    footer { margin-top: 20px; color: #94a3b8; font-size: 13px; }
    .center { display: flex; justify-content: center; align-items: center;
              min-height: 100vh; font-size: 18px; color: #475569; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [veicoli, setVeicoli] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetch('/api/veicoli')
          .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status + ' — token scaduto?');
            return r.json();
          })
          .then(data => { setVeicoli(data.value || []); setLoading(false); })
          .catch(e => { setError(e.message); setLoading(false); });
      }, []);

      if (loading) return <div className="center">⏳ Connessione a Business Central…</div>;
      if (error) return <div className="center error">❌ {error}</div>;

      return (
        <div className="container">
          <header>
            <h1>🚗 Fleet Manager</h1>
            <p>Veicoli letti in tempo reale da Dynamics 365 Business Central</p>
          </header>
          <table>
            <thead>
              <tr><th>Nr.</th><th>Marca</th><th>Modello</th><th>Targa</th><th>Stato</th></tr>
            </thead>
            <tbody>
              {veicoli.map(v => (
                <tr key={v.id}>
                  <td><strong>{v.number}</strong></td>
                  <td>{v.marca}</td>
                  <td>{v.modello}</td>
                  <td>{v.targa}</td>
                  <td><span className="badge">{v.stato}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
          <footer>{veicoli.length} veicoli • sorgente: ERP Business Central (OData API + OAuth2)</footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
